<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hype Street | IP Market Terminal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="search-overlay" class="search-overlay">
        <div class="search-modal">
            <div class="search-bar-container">
                <i class="fas fa-search"></i>
                <input type="text" id="ip-search-input" placeholder="Search IP / Franchise..." autocomplete="off">
            </div>
            <div id="predictions" class="predictions-box"></div>
        </div>
    </div>

    <header class="terminal-nav">
        <div class="nav-left">
            <i class="fas fa-search" id="open-search"></i>
            <span class="logo">HYPE<span>STREET</span></span>
        </div>
        <div class="ticker-box">
            <span id="active-ip">FRANCHISE</span>
            <span id="live-price">0.000</span>
            <span id="trend-icon"></span>
        </div>
    </header>

    <main class="chart-container">
        <div class="price-float" id="corner-price">0.000</div>
        <canvas id="hypeChart"></canvas>
    </main>

    <footer class="time-switches">
        <button onclick="setTime('day')">1D</button>
        <button onclick="setTime('month')">1M</button>
        <button onclick="setTime('year')" class="active">1Y</button>
        <button onclick="setTime('decade')">10Y</button>
        <button onclick="setTime('all')">ALL</button>
        <div class="terminal-clock">TERMINAL ACTIVE: 2026.03.04</div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
